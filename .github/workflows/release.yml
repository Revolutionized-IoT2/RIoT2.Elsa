name: Release

# Push a x.y.z tag to release ghcr.io/revolutionized-iot2/riot2-elsa:<tag> and :latest, and the RIoT2.Elsa.Workflows
# package with the version in Directory.Build.repo.props, which the orchestrator's embedded workflow engine uses (ADR 0016).

on:
  push:
    tags: ["*.*.*"]

permissions:
  # write: the package job attaches its SBOM to the GitHub release of the tag.
  contents: write
  packages: write

jobs:
  validate:
    uses: Revolutionized-IoT2/.github/.github/workflows/dotnet-validate.yml@main
    with:
      build: RIoT2.Elsa.sln
      test: RIoT2.Elsa.sln
      # The tests read the golden files in RIoT2.Core/contracts/golden.
      siblings: RIoT2.Core
    secrets: inherit

  image:
    needs: validate
    uses: Revolutionized-IoT2/.github/.github/workflows/docker-publish.yml@main
    with:
      image: riot2-elsa
      push: true
    secrets: inherit

  package:
    needs: validate
    uses: Revolutionized-IoT2/.github/.github/workflows/nuget-publish.yml@main
    with:
      project: RIoT2.Elsa.Workflows/RIoT2.Elsa.Workflows.csproj
      push: true
    secrets: inherit
